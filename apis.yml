apis:
- aid: fabric8labs:mcp
  name: Fabric8Labs MCP Server (WordPress MCP Adapter)
  description: >-
    A Model Context Protocol server endpoint registered on www.fabric8labs.com under the WordPress
    REST "mcp" namespace and served at /wp-json/mcp/mcp-oauth-server (with a sibling
    /wp-json/mcp/mcp-adapter-default-server). The endpoint is live and advertises itself correctly
    via RFC 9728 protected-resource metadata and RFC 8414 authorization-server metadata at the
    fabric8labs.com well-known paths, but it is authentication-gated: an anonymous JSON-RPC
    tools/list returns HTTP 401 mcp_unauthorized with a WWW-Authenticate Bearer challenge, so the
    published tool set and its input schemas could not be enumerated. This is WordPress MCP Adapter
    infrastructure over site content, not a Fabric8Labs product API.
  humanURL: https://www.fabric8labs.com/wp-json/mcp
  baseURL: https://www.fabric8labs.com/wp-json/mcp/mcp-oauth-server
  tags:
  - MCP
  - Agents
  properties:
  - type: MCPServer
    url: mcp/fabric8labs-mcp.yml
  - type: ToolCrosswalk
    url: mcp/fabric8labs-tool-crosswalk.yml
