aid: fabric8labs
name: Fabric8Labs
description: 'Fabric8Labs is a San Diego, California based advanced-manufacturing company founded
  in 2015 that invented and commercialized Electrochemical Additive Manufacturing (ECAM), a
  room-temperature metal 3D printing process that uses a patented microelectrode array printhead to
  electroplate copper ions out of a water-based metal-salt solution pixel by pixel. Unlike
  powder-bed and laser metal additive methods, ECAM needs no high-temperature step, no expensive
  metal powder feedstock and effectively no post-processing, prints at micron-scale resolution
  directly onto temperature-sensitive substrates, and the company reports more than a 90% reduction
  in greenhouse gas emissions against alternative additive and traditional manufacturing routes.
  Fabric8Labs operates as both a technology developer and a production foundry, manufacturing
  high-precision components for data-center liquid cooling and AI/HPC thermal management (cold
  plates, single-phase, two-phase and immersion cooling), RF and wireless communications, satellite
  and aerospace systems, power electronics, photonics cooling, semiconductors, medical devices and
  luxury goods. It has raised funding from Intel Capital, TDK Ventures and others, including a $50M
  round announced in November 2025 to expand United States manufacturing capacity toward tens of
  millions of components annually, and on 10 June 2026 announced it will be acquired by TDK
  Corporation — the company continues under existing leadership, with ECAM folded into TDK''s global
  manufacturing network. Fabric8Labs publishes no product, customer or developer API and
  runs no developer program; the only machine-readable surface on fabric8labs.com is the public
  WordPress REST API (namespace wp/v2) that serves the company newsroom, site pages, leadership
  team directory, taxonomy and media library as JSON, alongside a WordPress MCP Adapter endpoint and
  RFC 8414/RFC 9728 OAuth discovery documents that are served but authentication-gated.'
